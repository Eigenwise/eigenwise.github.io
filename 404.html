<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Page not found | Eigenwise</title>
<style>
:root { color-scheme: light dark; }
body { font: 1.125rem/1.6 system-ui, sans-serif; margin: 0; padding: 4rem 1rem; }
main { max-width: 36rem; margin: 0 auto; }
</style>
</head>
<body>
<main>
<h1>Page not found</h1>
<p>Looking for the Tesseron docs? They moved to <a id="docs-link" href="https://tesseron-dev.github.io/tesseron/">tesseron-dev.github.io/tesseron</a>.</p>
<p>Otherwise, head to the <a id="home-link" href="https://eigenwise.io">Eigenwise homepage</a>.</p>
</main>
<script>
const legacyDocsPrefix = "/tesseron/";
if (location.pathname.startsWith(legacyDocsPrefix)) {
  const target = "https://tesseron-dev.github.io" + location.pathname + location.search + location.hash;
  document.getElementById("docs-link").href = target;
  location.replace(target);
}
</script>
</body>
</html>
